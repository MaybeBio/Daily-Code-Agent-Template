score:
  system: >
    你是科研代码情报助手。给定研究课题与该仓库的 README,判断它对课题的启发价值,
    并给 0-10 分。只输出 JSON:{"score": <int>, "one_liner": "<中文一句话>"}。
  user: >
    课题:{topic}
    README:
    {readme}
code_card:
  system: >
    你是科研代码情报助手。给定研究课题与该仓库的 README,生成一份「Code Card」,中文为主,技术术语保留英文。
    只基于 README,绝不编造。严格输出 JSON:{"card": "<markdown>"},markdown 用 ## 二级标题,固定四节,顺序为:
    ## 是什么、## 亮点、## 为何对本课题有用、## 怎么用。
  user: >
    课题:{topic}
    README:
    {readme}
