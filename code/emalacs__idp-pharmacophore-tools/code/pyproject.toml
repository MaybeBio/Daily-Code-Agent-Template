[build-system]
requires = ["setuptools>=61.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-pharmacophore-tools"
version = "0.1.0"
description = "Pharmacophore definition from molecular dynamics simulations of intrinsically disordered proteins (IDPs)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "emalacs", email = "emanuele.scalone@gmail.com" },
]
keywords = [
    "pharmacophore",
    "molecular dynamics",
    "intrinsically disordered proteins",
    "structural biology",
    "cheminformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy",
    "pandas",
    "mdtraj",
    "MDAnalysis",
    "rdkit",
    "plotly",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "networkx",
    "mrcfile",
    "tqdm",
    "Pillow",
    "deeptime",
]

[project.optional-dependencies]
gpu = ["torch"]
stats = ["pyblock"]
clustering = ["hdbscan"]
all = ["torch", "pyblock", "hdbscan"]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/emalacs/idp-pharmacophore-tools"
Repository = "https://github.com/emalacs/idp-pharmacophore-tools"

[project.scripts]
idp-pharmacophore = "idp_pharmacophore_tools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
